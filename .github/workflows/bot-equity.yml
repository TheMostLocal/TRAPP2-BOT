name: Bot equity tape (30-min)

# Values the bot's whole book (cash + live-priced positions) every 30 minutes and
# appends a point to data/bot_equity_history.json — a Robinhood-style intraday
# price history — then pushes the same point to the BOT Supabase project.
# Runs through the US session (covers both EDT and EST); tweak the hours if you
# want pre/post-market marks too.

on:
  # z144: retired from the schedule - bot-loop.yml writes an equity point after every runner pass.
  # Kept for a manual snapshot.
  workflow_dispatch:

concurrency:
  group: bot-equity
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Start from the latest main (z117)
        # A queued run checks out the commit it was TRIGGERED on and can wait a long
        # time in its concurrency group. Committing from that stale tree and then
        # merging "ours" overwrites newer work (2026-10-16: intraday tape points lost).
        run: |
          git fetch -q origin "${{ github.ref_name }}" && { git merge -q --ff-only FETCH_HEAD || git reset -q --hard FETCH_HEAD; }
          echo "at $(git rev-parse --short HEAD)"

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Value the book
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/bot_equity_snapshot.py
      - name: Commit the tape
        run: |
          git config user.name  "bot-equity[bot]"
          git config user.email "bot-equity@users.noreply.github.com"
          git add data/bot_equity_history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "equity tape: $(date -u +%FT%TZ)"
            # fetch + merge -X ours (NOT pull --rebase -X ours: during a rebase
            # "ours" is the REMOTE side, so the old loop discarded this run's data).
            for i in 1 2 3 4 5; do
              if git push; then echo "Pushed on attempt $i"; break; fi
              git fetch origin
              git merge -X ours origin/${{ github.ref_name }} --no-edit 2>/dev/null || true
              if [ -f .git/MERGE_HEAD ]; then
                git checkout --ours -- data/bot_equity_history.json 2>/dev/null || true
                git add data/bot_equity_history.json 2>/dev/null || true
                git commit --no-edit 2>/dev/null || true
              fi
              sleep $((i * 2))
            done
          else
            echo "no change"
          fi
