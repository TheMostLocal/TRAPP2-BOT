name: Supabase doctor

# Manual health check for this repo's Supabase project: key kind, project-ref
# match, table existence, row counts and a write probe per table (sentinel row
# written + deleted). Never prints key values. Run: Actions -> Supabase doctor.

on:
  workflow_dispatch: {}

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/supabase_doctor.py bot
